name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Version de Xcode
        run: xcodebuild -version

      - name: Compiler l'app sans signature
        run: |
          set -o pipefail
          xcodebuild \
            -project Studia.xcodeproj \
            -target Studia \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Empaqueter en .ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/Studia.app"
          test -d "$APP" || (echo "App introuvable: $APP" && ls build/Build/Products/Release-iphoneos && exit 1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Studia-unsigned.ipa Payload
          ls -lh Studia-unsigned.ipa

      - name: Publier l'ipa
        uses: actions/upload-artifact@v4
        with:
          name: Studia-ipa
          path: Studia-unsigned.ipa
          retention-days: 30
